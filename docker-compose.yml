services:
  monitor-return:
    build: .
    image: monitor-return:latest
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      # Automatic howling suppression is off by default; the engineer enables
      # it when they start the return service:
      #   MONITOR_AUTO_SUPPRESSION=true docker compose up --build
      # or set it to "true" here.
      MONITOR_AUTO_SUPPRESSION: "${MONITOR_AUTO_SUPPRESSION:-false}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # One-shot lossy/reordered API demo:
  #   docker compose --profile demo run --rm demo
  # With auto suppression enabled on the service, add --suppression:
  #   docker compose --profile demo run --rm demo --suppression
  # (or append the flag after `scripts/demo.py`).
  demo:
    image: monitor-return:latest
    profiles: ["demo"]
    depends_on:
      monitor-return:
        condition: service_healthy
    volumes:
      - ./demo_out:/tmp/demo_out
    entrypoint:
      - python
      - scripts/demo.py
      - --url
      - http://monitor-return:8000
      - --out
      - /tmp/demo_out
